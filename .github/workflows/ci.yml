name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test Suite (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Vendored Dependencies Distribution
        run: |
          test -f external/slippi-js-master/dist/node/index.esm.js || {
            echo "ERROR: Vendored Slippi bundle dist/node/index.esm.js is missing!"
            exit 1
          }

      - name: Run Unit, Integration & E2E Tests
        run: npm test

      - name: Run Test Coverage Reporter
        run: npm run test:coverage

      - name: Run Legacy Milestone & Adversarial Suites
        run: npm run test:legacy

      - name: Verify Zero Replay Accumulation
        run: |
          SLP_COUNT=$(find temp_slp/ -name "*.slp" 2>/dev/null | wc -l)
          if [ "$SLP_COUNT" -ne 0 ]; then
            echo "ERROR: Zero accumulation violated! Found $SLP_COUNT .slp files in temp_slp/"
            exit 1
          fi

  deploy:
    name: Release & Deployment Verification
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Production Dependencies
        run: npm ci --omit=dev

      - name: Validate Production Build & CLI Readiness
        run: |
          node --no-warnings src/cli.js help
          echo "Production engine verified and deployable."
